<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tío Yacu — Asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-weather">
  <div class="sky sky-soft" aria-hidden="true">
    <span class="cloud cloud-a"></span>
    <span class="cloud cloud-b"></span>
    <span class="cloud cloud-c"></span>
  </div>

  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark compact">Tío Yacu</span>
      <span class="brand-sub">Rioja, San Martín</span>
    </div>
    <nav class="top-actions">
      <a class="btn ghost" href="weather.html">Clima</a>
      <button id="logout-btn" type="button" class="btn ghost">Cerrar sesión</button>
    </nav>
  </header>

  <main class="shell weather-shell">
    <section class="stage weather-stage">
      <h1 class="headline weather-headline">Asistencia y predicción</h1>
      <p class="lead">Elige una fecha. Si ya pasó, verás cuánta gente asistió y cómo estuvo el clima. Si es futura, verás la estimación y si conviene ir.</p>

      <form id="tioyacu-form" class="form surface query-bar" method="post" action="#" novalidate>
        <div class="field grow">
          <label for="visit-date">Fecha</label>
          <input id="visit-date" name="date" type="date" required />
        </div>
        <button type="submit" class="btn primary" id="consult-btn">Consultar</button>
      </form>

      <p id="tioyacu-error" class="message error" hidden></p>

      <article id="prediction-result" class="result weather-board" hidden>
        <p id="advice" class="advice" hidden></p>
        <div class="result-hero compact-hero">
          <h2 id="result-title">Tío Yacu</h2>
          <p id="result-count" class="result-summary"></p>
          <p id="result-reason" class="result-summary"></p>
        </div>
        <dl id="result-metrics" class="metrics">
          <div class="metric metric-temp">
            <dt>Temperatura</dt>
            <dd id="result-temperature"></dd>
          </div>
          <div class="metric">
            <dt>Estado</dt>
            <dd id="result-condition"></dd>
          </div>
          <div class="metric metric-humidity">
            <dt>Humedad</dt>
            <dd id="result-humidity"></dd>
          </div>
        </dl>
      </article>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script src="js/tioyacu.js"></script>
</body>
</html>
