<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta meteorológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-weather">
  <div class="sky sky-soft" aria-hidden="true">
    <span class="cloud cloud-a"></span>
    <span class="cloud cloud-b"></span>
    <span class="cloud cloud-c"></span>
  </div>

  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark compact">Consultor de Clima</span>
      <span class="brand-sub">Consulta meteorológica</span>
    </div>
    <button id="logout-btn" type="button" class="btn ghost">Cerrar sesión</button>
  </header>

  <main class="shell weather-shell">
    <section class="stage weather-stage">
      <h1 class="headline weather-headline">¿Dónde quieres saber el clima?</h1>
      <p class="lead">Elige un país o región y pulsa Consultar.</p>

      <form id="weather-form" class="form surface query-bar" method="post" action="#" novalidate>
        <div class="field grow">
          <label for="location">País o región</label>
          <select id="location" name="location" required>
            <option value="">— Selecciona —</option>
            <option value="Peru">Perú</option>
            <option value="Lima">Lima</option>
            <option value="Mexico">México</option>
            <option value="Spain">España</option>
            <option value="Madrid">Madrid</option>
            <option value="Argentina">Argentina</option>
            <option value="Colombia">Colombia</option>
            <option value="Chile">Chile</option>
            <option value="Brazil">Brasil</option>
            <option value="United States">Estados Unidos</option>
          </select>
        </div>
        <button type="submit" class="btn primary" id="consult-btn">Consultar</button>
      </form>

      <p id="weather-error" class="message error" hidden></p>

      <div id="weather-loading" class="loading-panel" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p>Consultando proveedor del clima…</p>
      </div>

      <article id="weather-result" class="result weather-board" hidden>
        <div class="result-hero">
          <p class="result-kicker">Ubicación</p>
          <h2 id="result-location"></h2>
          <p id="result-condition" class="result-condition"></p>
        </div>
        <dl class="metrics">
          <div class="metric metric-temp">
            <dt>Temperatura</dt>
            <dd id="result-temperature"></dd>
          </div>
          <div class="metric metric-humidity">
            <dt>Humedad</dt>
            <dd id="result-humidity"></dd>
          </div>
          <div class="metric metric-state">
            <dt>Estado</dt>
            <dd id="result-condition-copy"></dd>
          </div>
        </dl>
      </article>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script src="js/weather.js"></script>
</body>
</html>
