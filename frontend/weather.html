<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta meteorológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-weather">
  <div class="sky sky-soft" id="sky" aria-hidden="true">
    <span class="sun"></span>
    <span class="moon"></span>
    <span class="stars"></span>
    <span class="cloud cloud-a"></span>
    <span class="cloud cloud-b"></span>
    <span class="cloud cloud-c"></span>
    <div class="rain"></div>
  </div>

  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark compact">Consultor de Clima</span>
      <span class="brand-sub">Perú</span>
    </div>
    <nav class="top-actions">
      <a class="btn ghost" href="tioyacu.html">Tío Yacu</a>
      <button id="logout-btn" type="button" class="btn ghost">Cerrar sesión</button>
    </nav>
  </header>

  <main class="shell weather-shell">
    <section class="stage weather-stage">
      <h1 class="headline weather-headline">Consulta el clima en Perú</h1>
      <p class="lead">Escribe una ciudad o región. Si lo dejas vacío, se consultan todas las partes del país.</p>

      <form id="weather-form" class="form surface query-bar" method="post" action="#" novalidate>
        <div class="field grow">
          <label for="location">Ciudad o región</label>
          <input id="location" name="location" type="search" placeholder="Ej. Cusco, Arequipa, Puno…" autocomplete="off" />
        </div>
        <button type="submit" class="btn primary" id="consult-btn">Consultar</button>
      </form>

      <p id="weather-error" class="message error" hidden></p>

      <div id="weather-loading" class="loading-panel" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p>Consultando el clima…</p>
      </div>

      <article id="weather-result" class="result weather-board" hidden>
        <div class="result-hero compact-hero">
          <h2 id="result-location"></h2>
          <p id="result-summary" class="result-summary"></p>
        </div>
        <div id="cities-grid" class="results-table-wrap" hidden></div>
      </article>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script src="js/weather.js"></script>
</body>
</html>
