<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultor de Clima — Inicio de sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-login">
  <div class="sky" aria-hidden="true">
    <span class="cloud cloud-a"></span>
    <span class="cloud cloud-b"></span>
    <span class="cloud cloud-c"></span>
    <span class="sun"></span>
  </div>

  <main class="shell login-shell">
    <section class="stage auth-stage">
      <p class="brand-mark">Consultor de Clima</p>
      <h1 class="headline">El clima de tu destino, al instante</h1>
      <p class="lead">Inicia sesión para consultar temperatura, estado y humedad por país o región.</p>

      <form id="login-form" class="form surface" method="post" action="#" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Tu usuario" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required />
        </div>

        <button type="submit" class="btn primary" id="login-submit">Iniciar sesión</button>
        <p id="login-error" class="message error" hidden></p>
      </form>

      <p class="hint">Acceso demo: <code>admin</code> · <code>admin123</code></p>
      <p class="course-note">Curso · Desarrollo de aplicaciones para la nube</p>
    </section>
  </main>

  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
